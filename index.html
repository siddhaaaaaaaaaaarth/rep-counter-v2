<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- no maximum-scale: it blocks pinch-zoom on iOS and Android ignores it anyway.
     Inputs are >=16px instead, which is what stops iOS zooming on focus. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rep Counter">
<meta name="theme-color" content="#0a0a0a" id="themeColor">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>REP COUNTER</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app"></div>
<div id="sheetRoot"></div>

<script src="js/store.js"></script>
<script src="js/themes.js"></script>
<script src="js/timer.js"></script>
<script src="js/ui.js"></script>
<script src="js/screens.js"></script>
<script src="js/app.js"></script>

<script>
/* Register the offline cache. Service workers only run on HTTPS or localhost —
 * over plain http:// on a LAN address the browser refuses to register one, and
 * the app simply behaves as it did before (online-only). */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function (err) {
      console.log('offline cache unavailable:', err.message);
    });
  });
}
</script>
</body>
</html>
